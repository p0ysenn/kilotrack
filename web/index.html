<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kilotrack</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 1rem auto;
    padding: 0 1rem;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  .field { position: relative; }
  input {
    width: 100%;
    font-size: 1rem;
    padding: 0.65rem 0.6rem;
    margin-top: 0.25rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  input[readonly] { background: #eee; color: #555; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    background: white;
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 6px 6px;
    max-height: 220px;
    overflow-y: auto;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .suggestion-item {
    padding: 0.7rem 0.6rem;
    cursor: pointer;
    border-top: 1px solid #eee;
  }
  .suggestion-item:first-child { border-top: none; }
  .suggestion-item:hover, .suggestion-item.active { background: #f0f0f0; }
  #result {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 8px;
    background: #f0f0f0;
    min-height: 1.5rem;
  }
  .km { font-size: 1.8rem; font-weight: 700; }
  .line-tag {
    display: inline-block;
    background: #333;
    color: white;
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-size: 0.85rem;
    margin-right: 0.3rem;
  }
  .error { color: #b00020; }
  .option-list { margin-top: 0.8rem; }
  .option-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.4rem 0.8rem;
    padding: 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .option-row:hover { background: #e8e8e8; }
  .option-row.selected { background: #333; color: white; }
  .option-row.selected .line-tag { background: white; color: #333; }
  .option-km { white-space: nowrap; font-weight: 600; }

  button {
    font-size: 1rem;
    padding: 0.7rem 0.9rem;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #bbb; cursor: default; }
  #add-leg-btn { margin-top: 0.8rem; width: 100%; }

  #legs { margin-top: 1.5rem; }
  .leg-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.3rem 0.6rem;
    padding: 0.6rem 0.2rem;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  .leg-stops { flex: 1 1 100%; min-width: 0; overflow-wrap: break-word; }
  .leg-km { white-space: nowrap; font-weight: 600; }
  .leg-remove {
    background: none;
    color: #b00020;
    font-size: 1.2rem;
    line-height: 1;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #total {
    margin-top: 0.8rem;
    padding-top: 0.6rem;
    border-top: 2px solid #333;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
  }
  #reset-btn { margin-top: 1rem; width: 100%; background: #888; }

  @media (min-width: 480px) {
    body { margin-top: 2rem; }
    .leg-stops { flex: 1 1 auto; }
    #reset-btn { width: auto; }
  }
</style>
</head>
<body>

<h1>Kilotrack</h1>

<label for="start">From</label>
<div class="field">
  <input id="start" autocomplete="off" placeholder="Stop...">
  <div id="start-suggestions" class="suggestions" style="display:none"></div>
</div>

<label for="end">To</label>
<div class="field">
  <input id="end" autocomplete="off" placeholder="Stop...">
  <div id="end-suggestions" class="suggestions" style="display:none"></div>
</div>

<div id="result"></div>
<button id="add-leg-btn" disabled>+ Add connection</button>

<div id="legs"></div>
<div id="total" style="display:none"></div>
<button id="reset-btn" style="display:none">New trip</button>

<script src="data.js"></script>
<script>
const data = KILOTRACK_DATA;

const nameById = data.stopNames;
const idsByName = {};
for (const [id, name] of Object.entries(nameById)) {
  (idsByName[name] ??= []).push(id);
}

const allStopNames = Object.keys(idsByName).sort();
const MAX_SUGGESTIONS = 20;

// Ranks matches so "Bahnhof" finds "Wolfenbüttel, Bahnhof" even though many
// other "<Town>, Bahnhof" stops across the region sort earlier alphabetically:
// whole-string match, then word-start match (after a space/comma), then any
// substring — ties broken by length, since shorter names tend to be the ones
// people actually mean.
function rankedStopMatches(query) {
  const q = query.toLowerCase();
  const tiers = [[], [], []];
  for (const name of allStopNames) {
    const lower = name.toLowerCase();
    const idx = lower.indexOf(q);
    if (idx === -1) continue;
    if (idx === 0) tiers[0].push(name);
    else if (/[\s,]/.test(lower[idx - 1])) tiers[1].push(name);
    else tiers[2].push(name);
  }
  for (const tier of tiers) tier.sort((a, b) => a.length - b.length);
  return [...tiers[0], ...tiers[1], ...tiers[2]];
}

// Native <datalist> doesn't render on iOS Safari at all, and is inconsistent
// elsewhere on mobile — this is a plain JS dropdown instead, so it works the
// same everywhere.
function setupAutocomplete(inputId, suggestionsId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionsId);

  function showSuggestions() {
    if (input.readOnly) { box.style.display = "none"; return; }
    const q = input.value.trim().toLowerCase();
    const matches = (q ? rankedStopMatches(q) : allStopNames).slice(0, MAX_SUGGESTIONS);

    if (matches.length === 0 || (matches.length === 1 && matches[0].toLowerCase() === q)) {
      box.style.display = "none";
      return;
    }
    box.innerHTML = matches.map((n) => `<div class="suggestion-item">${n}</div>`).join("");
    box.style.display = "block";
  }

  input.addEventListener("input", () => { showSuggestions(); render(); });
  input.addEventListener("focus", showSuggestions);
  // Blur fires before a tap's click on mobile — delay hiding so the
  // suggestion's click handler still gets a chance to run.
  input.addEventListener("blur", () => setTimeout(() => { box.style.display = "none"; }, 150));

  box.addEventListener("click", (e) => {
    const item = e.target.closest(".suggestion-item");
    if (!item) return;
    input.value = item.textContent;
    box.style.display = "none";
    render();
  });
}

setupAutocomplete("start", "start-suggestions");
setupAutocomplete("end", "end-suggestions");

function pairDistance(fromId, toId) {
  return data.pairs[`${fromId}_${toId}`];
}

// For a given pattern and a set of candidate start/end stop_ids, find every
// (startIdx, endIdx) occurrence with startIdx before endIdx, and sum the
// cached segment distances between them.
function matchesInPattern(pattern, startIds, endIds) {
  const results = [];
  for (let i = 0; i < pattern.length; i++) {
    if (!startIds.has(pattern[i])) continue;
    for (let j = i + 1; j < pattern.length; j++) {
      if (!endIds.has(pattern[j])) continue;
      let km = 0;
      let ok = true;
      for (let k = i; k < j; k++) {
        const d = pairDistance(pattern[k], pattern[k + 1]);
        if (d === undefined) { ok = false; break; }
        km += d;
      }
      if (ok) results.push(km);
    }
  }
  return results;
}

function findTrips(startName, endName) {
  const startIds = new Set(idsByName[startName] || []);
  const endIds = new Set(idsByName[endName] || []);
  if (startIds.size === 0 || endIds.size === 0) return [];

  const results = [];
  for (const info of Object.values(data.routes)) {
    let bestForLine = null;
    for (const pattern of info.patterns) {
      for (const km of matchesInPattern(pattern, startIds, endIds)) {
        if (bestForLine === null || km < bestForLine) bestForLine = km;
      }
    }
    if (bestForLine !== null) {
      results.push({ line: info.short_name, km: bestForLine });
    }
  }
  results.sort((a, b) => a.km - b.km);
  return results;
}

let currentTrips = [];
let selectedIndex = 0;
let legs = []; // committed chain: [{start, end, line, km}, ...]

function renderResult() {
  const resultEl = document.getElementById("result");
  const addBtn = document.getElementById("add-leg-btn");

  if (currentTrips.length === 0) {
    addBtn.disabled = true;
    return;
  }

  addBtn.disabled = false;
  const selected = currentTrips[selectedIndex];
  let html = `<span class="line-tag">${selected.line}</span><span class="km">${selected.km.toFixed(2)} km</span>`;

  if (currentTrips.length > 1) {
    html += `<div class="option-list">` +
      currentTrips.map((t, i) => `
        <div class="option-row ${i === selectedIndex ? "selected" : ""}" data-index="${i}">
          <span><span class="line-tag">${t.line}</span></span>
          <span class="option-km">${t.km.toFixed(2)} km</span>
        </div>`).join("") +
      `</div>`;
  }
  resultEl.innerHTML = html;
}

function pickTrip(index) {
  selectedIndex = index;
  renderResult();
}

function renderLegs() {
  const legsEl = document.getElementById("legs");
  const totalEl = document.getElementById("total");
  const resetBtn = document.getElementById("reset-btn");

  if (legs.length === 0) {
    legsEl.innerHTML = "";
    totalEl.style.display = "none";
    resetBtn.style.display = "none";
    return;
  }

  legsEl.innerHTML = legs.map((leg, i) => `
    <div class="leg-row">
      <div class="leg-stops"><span class="line-tag">${leg.line}</span>${leg.start} → ${leg.end}</div>
      <div class="leg-km">${leg.km.toFixed(2)} km</div>
      <button class="leg-remove" data-index="${i}" title="Remove">×</button>
    </div>`).join("");

  const total = legs.reduce((sum, l) => sum + l.km, 0);
  totalEl.innerHTML = `<span>Total (${legs.length} ${legs.length === 1 ? "leg" : "legs"})</span><span>${total.toFixed(2)} km</span>`;
  totalEl.style.display = "flex";
  resetBtn.style.display = "block";
}

function removeLegsFrom(index) {
  legs = legs.slice(0, index);
  const startInput = document.getElementById("start");
  if (legs.length === 0) {
    startInput.readOnly = false;
    startInput.value = "";
  } else {
    startInput.value = legs[legs.length - 1].end;
  }
  document.getElementById("end").value = "";
  currentTrips = [];
  document.getElementById("result").innerHTML = "";
  document.getElementById("add-leg-btn").disabled = true;
  renderLegs();
}

function addLeg() {
  if (currentTrips.length === 0) return;
  const startInput = document.getElementById("start");
  const endInput = document.getElementById("end");
  const selected = currentTrips[selectedIndex];

  legs.push({ start: startInput.value.trim(), end: endInput.value.trim(), line: selected.line, km: selected.km });

  startInput.value = legs[legs.length - 1].end;
  startInput.readOnly = true;
  endInput.value = "";
  currentTrips = [];
  document.getElementById("result").innerHTML = "";
  document.getElementById("add-leg-btn").disabled = true;
  renderLegs();
  endInput.focus();
}

function resetAll() {
  legs = [];
  currentTrips = [];
  const startInput = document.getElementById("start");
  startInput.readOnly = false;
  startInput.value = "";
  document.getElementById("end").value = "";
  document.getElementById("result").innerHTML = "";
  document.getElementById("add-leg-btn").disabled = true;
  renderLegs();
  startInput.focus();
}

function render() {
  const start = document.getElementById("start").value.trim();
  const end = document.getElementById("end").value.trim();
  const resultEl = document.getElementById("result");
  const addBtn = document.getElementById("add-leg-btn");

  if (!start || !end) {
    currentTrips = [];
    resultEl.innerHTML = "";
    addBtn.disabled = true;
    return;
  }
  if (start === end) {
    currentTrips = [];
    resultEl.innerHTML = `<span class="error">Start and destination are the same.</span>`;
    addBtn.disabled = true;
    return;
  }

  currentTrips = findTrips(start, end);
  selectedIndex = 0;
  if (currentTrips.length === 0) {
    resultEl.innerHTML = `<span class="error">No line found connecting both stops in this order.</span>`;
    addBtn.disabled = true;
    return;
  }
  renderResult();
}

document.getElementById("result").addEventListener("click", (e) => {
  const row = e.target.closest(".option-row");
  if (row) pickTrip(Number(row.dataset.index));
});
document.getElementById("add-leg-btn").addEventListener("click", addLeg);
document.getElementById("reset-btn").addEventListener("click", resetAll);
document.getElementById("legs").addEventListener("click", (e) => {
  const btn = e.target.closest(".leg-remove");
  if (btn) removeLegsFrom(Number(btn.dataset.index));
});
</script>

</body>
</html>
